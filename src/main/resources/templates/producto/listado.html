<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-4">
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">[[#{producto.agregar}]]</h4>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/producto/guardar}" th:object="${producto}" method="post">
                                <input type="hidden" th:field="*{idProducto}"/>

                                <label class="form-label">[[#{producto.descripcion}]]</label>
                                <input type="text" th:field="*{descripcion}" class="form-control" required/>
                                <div class="text-danger small" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>

                                <label class="form-label mt-3">[[#{producto.categoria}]]</label>
                                <select th:field="*{categoria.idCategoria}" class="form-select" required>
                                    <option value="">Seleccione</option>
                                    <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.descripcion}"></option>
                                </select>

                                <label class="form-label mt-3">[[#{producto.detalle}]]</label>
                                <textarea th:field="*{detalle}" class="form-control" rows="3"></textarea>

                                <label class="form-label mt-3">[[#{producto.precio}]]</label>
                                <input type="number" step="0.01" th:field="*{precio}" class="form-control" required/>
                                <div class="text-danger small" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>

                                <label class="form-label mt-3">[[#{producto.existencias}]]</label>
                                <input type="number" th:field="*{existencias}" class="form-control" required/>
                                <div class="text-danger small" th:if="${#fields.hasErrors('existencias')}" th:errors="*{existencias}"></div>

                                <label class="form-label mt-3">[[#{producto.imagen}]]</label>
                                <input type="url" th:field="*{rutaImagen}" class="form-control"/>

                                <div class="form-check mt-3">
                                    <input type="checkbox" th:field="*{activo}" class="form-check-input"/>
                                    <label class="form-check-label">[[#{producto.activo}]]</label>
                                </div>

                                <button class="btn btn-success mt-3" type="submit">[[#{accion.guardar}]]</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-success text-white">
                            <h4 class="mb-0">[[#{producto.listado}]]</h4>
                        </div>
                        <div class="card-body table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>[[#{producto.descripcion}]]</th>
                                        <th>[[#{producto.categoria}]]</th>
                                        <th>[[#{producto.precio}]]</th>
                                        <th>[[#{producto.existencias}]]</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="p : ${productos}">
                                        <td th:text="${p.idProducto}">1</td>
                                        <td th:text="${p.descripcion}">Producto</td>
                                        <td th:text="${p.categoria != null ? p.categoria.descripcion : 'Sin categoría'}">Categoría</td>
                                        <td th:text="${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                                        <td th:text="${p.existencias}">0</td>
                                        <td class="text-end">
                                            <a class="btn btn-sm btn-outline-primary" th:href="@{/producto/modificar/{id}(id=${p.idProducto})}">[[#{accion.actualizar}]]</a>
                                            <a class="btn btn-sm btn-outline-danger" th:href="@{/producto/eliminar/{id}(id=${p.idProducto})}">[[#{accion.eliminar}]]</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
