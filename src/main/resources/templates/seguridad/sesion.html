<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Información de sesión - Tienda</title>
    <meta charset="UTF-8"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">
                    <i class="fas fa-id-card"></i> Información de sesión
                </h4>
            </div>

            <div class="card-body">

                <div class="alert alert-success">
                    La sesión se encuentra autenticada correctamente.
                </div>

                <table class="table table-bordered">
                    <tbody>
                        <tr>
                            <th>Usuario autenticado</th>
                            <td>
                                <strong sec:authentication="name"></strong>
                            </td>
                        </tr>
                        <tr>
                            <th>Estado</th>
                            <td>
                                <span class="badge bg-success" sec:authorize="isAuthenticated()">
                                    AUTENTICADO
                                </span>
                            </td>
                        </tr>
                        <tr>
                            <th>Rol detectado</th>
                            <td>
                                <span class="badge bg-danger" sec:authorize="hasRole('ADMIN')">
                                    ADMIN
                                </span>

                                <span class="badge bg-warning text-dark" sec:authorize="hasRole('VENDEDOR')">
                                    VENDEDOR
                                </span>

                                <span class="badge bg-secondary" sec:authorize="hasRole('USUARIO')">
                                    USUARIO
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <h5 class="mt-4">Pruebas rápidas según permisos</h5>

                <div class="d-flex flex-wrap gap-2">
                    <a th:href="@{/perfil}" class="btn btn-primary">
                        Perfil
                    </a>

                    <a th:href="@{/consultas/listado}" class="btn btn-info text-white">
                        Consultas
                    </a>

                    <a th:href="@{/producto/listado}" class="btn btn-success" sec:authorize="hasAnyRole('ADMIN','VENDEDOR')">
                        Productos
                    </a>

                    <a th:href="@{/categoria/listado}" class="btn btn-success" sec:authorize="hasAnyRole('ADMIN','VENDEDOR')">
                        Categorías
                    </a>

                    <a th:href="@{/seguridad/pruebas}" class="btn btn-danger" sec:authorize="hasRole('ADMIN')">
                        Panel de seguridad
                    </a>
                </div>

                <hr/>

                <div class="text-center">
                    <a th:href="@{/}" class="btn btn-secondary">
                        Volver al inicio
                    </a>

                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-danger">
                            Cerrar sesión
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
