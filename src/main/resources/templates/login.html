<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Iniciar sesión - Tienda</title>
    <meta charset="UTF-8"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.min.css}" rel="stylesheet"/>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center">
                        <h4 class="mb-0">Iniciar sesión</h4>
                    </div>

                    <div class="card-body">
                        <form method="post" th:action="@{/login}">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" id="username" name="username" class="form-control" required autofocus/>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" id="password" name="password" class="form-control" required/>
                            </div>

                            <div th:if="${param.error}" class="alert alert-danger">
                                Usuario o contraseña incorrectos.
                            </div>

                            <div th:if="${param.logout}" class="alert alert-success">
                                Sesión cerrada correctamente.
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Entrar
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="card-footer text-center">
                        <a th:href="@{/}">Volver al inicio</a>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-body">
                        <h6>Usuarios de prueba</h6>
                        <p class="mb-1"><strong>Admin:</strong> juan / 123</p>
                        <p class="mb-1"><strong>Vendedor:</strong> rebeca / 456</p>
                        <p class="mb-0"><strong>Usuario:</strong> pedro / 789</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
