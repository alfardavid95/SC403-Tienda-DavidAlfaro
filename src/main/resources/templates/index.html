<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4">[[#{index.nuestrosProductos}]]</h2>
                <a th:href="@{/consultas/listado}" class="btn btn-outline-success">
                    <i class="fa-solid fa-magnifying-glass"></i> [[#{plantilla.consultas}]]
                </a>
            </div>

            <ul class="nav nav-tabs mb-4">
                <li class="nav-item">
                    <a th:classappend="${idCategoriaActual == 0} ? 'active'" class="nav-link" th:href="@{/}">Todos</a>
                </li>
                <li class="nav-item" th:each="c : ${categorias}">
                    <a th:classappend="${idCategoriaActual == c.idCategoria} ? 'active'"
                       class="nav-link"
                       th:href="@{/consultas/{idCategoria}(idCategoria=${c.idCategoria})}"
                       th:text="${c.descripcion}">Categoría</a>
                </li>
            </ul>

            <div class="alert alert-warning" th:if="${#lists.isEmpty(productos)}">
                [[#{lista.vacia}]]
            </div>

            <div class="row g-4" th:if="${!#lists.isEmpty(productos)}">
                <div class="col-sm-6 col-lg-4" th:each="p : ${productos}">
                    <div class="card h-100 shadow-sm">
                        <img th:if="${p.rutaImagen != null and !#strings.isEmpty(p.rutaImagen)}"
                             th:src="${p.rutaImagen}"
                             class="card-img-top producto-img"
                             alt="Imagen del producto"/>
                        <div class="card-body">
                            <h5 class="card-title" th:text="${p.descripcion}">Producto</h5>
                            <p class="text-muted mb-1" th:if="${p.categoria != null}" th:text="${p.categoria.descripcion}">Categoría</p>
                            <p class="card-text small" th:text="${p.detalle}">Detalle</p>
                        </div>
                        <div class="card-footer d-flex justify-content-between align-items-center">
                            <strong th:text="${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">0.00</strong>
                            <span class="badge bg-success" th:if="${p.activo}">Activo</span>
                            <span class="badge bg-secondary" th:unless="${p.activo}">Inactivo</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
