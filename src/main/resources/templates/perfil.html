<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Perfil - Tienda</title>
    <meta charset="UTF-8"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.min.css}" rel="stylesheet"/>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center">
                        <h4 class="mb-0">
                            <i class="fas fa-user"></i> Perfil de usuario
                        </h4>
                    </div>

                    <div class="card-body">
                        <p class="lead">
                            Usuario autenticado:
                            <strong sec:authentication="name"></strong>
                        </p>

                        <hr/>

                        <h5>Permisos detectados</h5>

                        <ul class="list-group">
                            <li class="list-group-item" sec:authorize="hasRole('ADMIN')">
                                Rol ADMIN: acceso completo al sistema.
                            </li>

                            <li class="list-group-item" sec:authorize="hasRole('VENDEDOR')">
                                Rol VENDEDOR: acceso a productos y categorías.
                            </li>

                            <li class="list-group-item" sec:authorize="hasRole('USUARIO')">
                                Rol USUARIO: acceso limitado.
                            </li>
                        </ul>
                    </div>

                    <div class="card-footer text-center">
                        <a th:href="@{/}" class="btn btn-primary">
                            Volver al inicio
                        </a>

                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger">
                                Cerrar sesión
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
